# Publish to the PowerShell Gallery.
#
#   * Push a version tag (e.g. v0.1.0)     -> real publish.
#   * Run manually (workflow_dispatch)     -> dry run by default (Publish-Module -WhatIf);
#                                             untick "dryRun" to publish from a manual run.
#
# One-time setup:
#   1. Create an API key at https://www.powershellgallery.com/account/apikeys
#      (scope: Push new packages and package versions; glob PSMutant).
#   2. Add it as the repo secret PSGALLERY_API_KEY
#      (Settings -> Secrets and variables -> Actions).
#   3. Bump ModuleVersion in PSMutant.psd1, then push a matching tag:
#        git tag v0.1.0 && git push origin v0.1.0
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Dry run (Publish-Module -WhatIf, nothing is pushed to the gallery)'
        type: boolean
        default: true

# NEVER cancel-in-progress here, unlike ci.yml and code-scanning.yml. A superseded CI run
# is waste; a half-finished publish is a gallery version that cannot be withdrawn. The group
# serialises releases instead, so a second tag waits rather than racing the first.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Every pinned version comes from one committed file, so the gates cannot drift apart.
      # Parsed and validated before it is exported: a missing key would otherwise become an
      # empty version string and a silently wrong cache key.
      - name: Load pinned versions
        shell: pwsh
        run: |
          $required = 'PESTER_VERSION', 'PESTER_COMPAT_VERSION', 'PSSA_VERSION',
                      'PSCOMPLEXITY_VERSION', 'CONVERTTOSARIF_VERSION', 'PSSA_PATHS'
          $pins = @{}
          foreach ($line in Get-Content .github/pins.env) {
            $t = $line.Trim()
            if (-not $t -or $t.StartsWith('#')) { continue }
            $k, $v = $t -split '=', 2
            $pins[$k.Trim()] = $v.Trim()
          }
          foreach ($k in $required) {
            if (-not $pins.ContainsKey($k) -or -not $pins[$k]) { throw ".github/pins.env is missing a value for $k" }
          }
          $pins.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" } |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "pins: $(($required | ForEach-Object { "$_=$($pins[$_])" }) -join '  ')"

      - name: Install pinned Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion $env:PESTER_VERSION -Force -Scope CurrentUser

      - name: Gate on unit tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Normal'
          $r = Invoke-Pester -Configuration $cfg
          # FailedCount alone cannot see a test file that failed to PARSE: it contributes
          # zero tests and zero failures, so the run reads green while a whole file never
          # executed. The decision is a tested pure function.
          . ./tools/GateDecisions.ps1
          $fault = Get-PSMutantTestRunFault -FailedCount $r.FailedCount `
              -ContainerResult @($r.Containers | ForEach-Object { [string]$_.Result }) `
              -ContainerName @($r.Containers | ForEach-Object { Split-Path $_.Item -Leaf })
          if ($fault) { throw "$fault Not publishing." }

      # Publishing used to run ONE of the seven gates that guard a merge. Rather than
      # duplicating the chain here -- six more minutes for a result that already exists --
      # require that CI actually passed for THIS commit. That is strictly stronger than
      # re-running a subset: it covers coverage, complexity, self-mutation and the Pester
      # compatibility guard, none of which ran on this path before.
      #
      # A tag can be pushed at any commit, including one that never sat on main, so the
      # check is against github.sha rather than against "main was green recently".
      - name: Require CI to have passed for this commit
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dryRun) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = '${{ github.sha }}'
          $deadline = (Get-Date).AddMinutes(12)
          # Tagging straight after a merge is the normal flow, so wait for the in-flight
          # run rather than failing it. CI takes about six minutes.
          while ($true) {
            # Select the check in jq rather than string-matching the name off the front:
            # "test=completed/failure" does not match "completed/*", which would have made
            # a definitively failed run wait the full timeout instead of refusing at once.
            $all = @(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" --paginate --jq '.check_runs[] | "\(.name)=\(.status)/\(.conclusion)"')
            $test = @(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" --paginate --jq '.check_runs[] | select(.name=="test") | "\(.status)/\(.conclusion)"') | Select-Object -First 1
            if ($test -eq 'completed/success') { Write-Host "CI passed for $sha"; break }
            if ($test -like 'completed/*') { throw "CI did not pass for $sha - $test. Not publishing." }
            if ((Get-Date) -gt $deadline) {
              throw "CI has not reported success for $sha within 12 minutes (saw: $($all -join ', ')). Not publishing."
            }
            Write-Host "waiting for CI on $sha ... (saw: $($all -join ', '))"
            Start-Sleep -Seconds 30
          }

      # The tag name arrives through the ENVIRONMENT, never through ${{ }}. An expression is
      # pasted into this script as text before pwsh parses it, so a tag name that closes the
      # string literal runs as code -- in the one job holding the gallery API key. git permits
      # a quote in a ref name, `v1.0";$x;"` is a legal tag, and pushing a tag needs no review
      # while pushing to main does. An env var is read at run time and is data whatever it says.
      - name: Verify tag matches ModuleVersion
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME.TrimStart('v')
          $ver = (Import-PowerShellDataFile ./PSMutant.psd1).ModuleVersion
          if ($tag -ne $ver) { throw "Tag $tag does not match ModuleVersion $ver" }

      # ModuleVersion, the newest CHANGELOG heading and the Gallery release notes are three
      # descriptions of one release, and nothing compared them: 0.2.2 shipped while its entry
      # was still under Unreleased, and the heading was renamed by hand afterwards. This also
      # captures the notes, so they are derived from the changelog rather than maintained a
      # second time by hand in the manifest.
      - name: Check release consistency and capture the notes
        shell: pwsh
        run: |
          $notes = ./tools/Test-PSMutantRelease.ps1
          $file = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes | Out-File -FilePath $file -Encoding utf8
          "RELEASE_NOTES_FILE=$file" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Release notes captured ($($notes.Length) chars)."

      # A version already on the gallery cannot be replaced or withdrawn, so a repeat
      # publish is not just noisy -- it is the one outcome we can never undo. It also
      # happens for an ordinary reason: publishing by hand (workflow_dispatch with
      # dryRun off) and then tagging the same commit afterwards for traceability. That
      # second step should be a no-op, not a red run.
      #
      # The skip is annotated as a WARNING on purpose. Skipping is right when the
      # version was published deliberately, but the same path is hit by a mistake --
      # forgetting to bump ModuleVersion -- where a silently green run would look like
      # a release that shipped when nothing did. The annotation surfaces it in the run
      # summary either way.
      - name: Skip if this version is already published
        id: exists
        shell: pwsh
        run: |
          $ver = (Import-PowerShellDataFile ./PSMutant.psd1).ModuleVersion
          $found = Find-Module PSMutant -RequiredVersion $ver -ErrorAction SilentlyContinue
          if ($found) {
              Write-Host "::warning::PSMutant $ver is already on the PowerShell Gallery (published $($found.PublishedDate)) - skipping the publish step. If you meant to release new code, bump ModuleVersion."
              "already=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }
          else {
              Write-Host "PSMutant $ver is not on the gallery yet."
              "already=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      # Staged as its own step so the artifact can be INSPECTED before it is pushed.
      # It used to be assembled inside the publish step, which meant the first thing ever
      # to load this folder was a consumer's machine.
      - name: Stage the module
        if: steps.exists.outputs.already != 'true'
        shell: pwsh
        run: |
          $stage = Join-Path ([System.IO.Path]::GetTempPath()) 'PSMutant'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          # Publish-Module requires the folder to be named exactly like the module.
          # schemas/ ships too. Both are public formats -- the config schema is what a
          # PSMutant config is written against, the report schema what a consumer reads
          # back -- and neither is any use left behind in this repo.
          Copy-Item ./PSMutant.psd1, ./PSMutant.psm1, ./src, ./schemas, ./LICENSE, ./README.md -Destination $stage -Recurse -Force
          "STAGE_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem $stage | ForEach-Object { Write-Host "  staged: $($_.Name)" }

      # The Gallery page is permanent, so the notes on it are derived from CHANGELOG.md
      # rather than transcribed. Only the STAGED manifest is rewritten; the one in git keeps
      # whatever it has, and the changelog stays the single source of truth.
      # The release check above already fails when PSMutant.psd1 disagrees with the CHANGELOG,
      # and the staged manifest is a copy of it -- so this asserts rather than rewrites. It
      # used to call Update-ModuleManifest, which does not update a manifest but REGENERATES
      # one: the shipped psd1 arrived as machine boilerplate with every comment dropped,
      # including the one saying Pester is deliberately absent from RequiredModules.
      - name: Staged manifest carries the changelog notes
        if: steps.exists.outputs.already != 'true'
        shell: pwsh
        run: |
          $notes = Get-Content $env:RELEASE_NOTES_FILE -Raw
          if ([string]::IsNullOrWhiteSpace($notes)) { throw 'Captured release notes are empty' }
          $staged = (Import-PowerShellDataFile (Join-Path $env:STAGE_DIR 'PSMutant.psd1')).PrivateData.PSData.ReleaseNotes
          if ($staged -ne $notes.TrimEnd("`r", "`n")) {
            throw 'Staged manifest ReleaseNotes do not match the captured CHANGELOG notes.'
          }
          Write-Host 'Staged manifest carries the CHANGELOG notes for this version.'

      # The gate this whole issue exists for: load the artifact that is about to become
      # permanent, and run a real mutation with it. A gallery version cannot be withdrawn.
      - name: Smoke-test the staged package
        if: steps.exists.outputs.already != 'true'
        shell: pwsh
        run: ./tools/Test-PSMutantPackage.ps1 -Path $env:STAGE_DIR

      - name: Publish to PSGallery
        if: steps.exists.outputs.already != 'true'
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
          # A tag push is always a real publish; a manual run honours the dryRun input
          # (default true), so a hand-triggered run can't accidentally push a release.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dryRun }}
        run: |
          if (-not $env:PSGALLERY_API_KEY) { throw 'PSGALLERY_API_KEY secret is not set' }
          $stage = '${{ env.STAGE_DIR }}'
          if (-not (Test-Path $stage)) { throw "Staged package missing at $stage" }

          $dryRun = $env:DRY_RUN -eq 'true'
          if ($dryRun) {
              Write-Host '### DRY RUN — Publish-Module -WhatIf (nothing will be pushed) ###' -ForegroundColor Yellow
              Publish-Module -Path $stage -NuGetApiKey $env:PSGALLERY_API_KEY -WhatIf -Verbose
              Write-Host '### DRY RUN complete — module staged and validated, not published. ###' -ForegroundColor Green
          }
          else {
              Publish-Module -Path $stage -NuGetApiKey $env:PSGALLERY_API_KEY -Verbose
              Write-Host '### Published to the PowerShell Gallery. ###' -ForegroundColor Green
          }
