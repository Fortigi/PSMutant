# CI gate. Everything runs in the required "test" job -- a red lint, a complexity breach
# (measured by our sibling module PSComplexity), a unit-test failure, a coverage drop or
# a self-mutation regression all block the merge. Dependencies are pinned for
# reproducibility.
#
# Pester is pinned to ONE version for the test estate, and every step imports that exact
# version rather than letting PowerShell resolve the name. CI used to pin 5.8.0 while
# development happened on 6.1.0, and the two disagreeing is what hid issue #16: the suite
# passed under a version CI did not run, and failed under the one it did.
#
# 5.8.0 is installed ALONGSIDE 6.1.0 on purpose. The module promises Pester >= 5.0.0, and
# the bug that promise hid only appears when two versions are present -- see the last step.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A superseded run proves nothing. Three pushes in quick succession used to mean three
# full chains; only the last one's result is ever read. Pushes to main are NOT cancelled
# -- that history is the record of what main was green at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # The module bounds each mutant with its own timeout, but nothing bounded the job.
    # A wedged runner would otherwise sit on the 6-hour default. The chain runs in about
    # 6 minutes, of which self-mutation is the long pole.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Every pinned version comes from one committed file, so the gates cannot drift apart.
      # Parsed and validated before it is exported: a missing key would otherwise become an
      # empty version string and a silently wrong cache key.
      - name: Load pinned versions
        shell: pwsh
        run: |
          $required = 'PESTER_VERSION', 'PESTER_COMPAT_VERSION', 'PSSA_VERSION',
                      'PSCOMPLEXITY_VERSION', 'CONVERTTOSARIF_VERSION', 'PSSA_PATHS'
          $pins = @{}
          foreach ($line in Get-Content .github/pins.env) {
            $t = $line.Trim()
            if (-not $t -or $t.StartsWith('#')) { continue }
            $k, $v = $t -split '=', 2
            $pins[$k.Trim()] = $v.Trim()
          }
          foreach ($k in $required) {
            if (-not $pins.ContainsKey($k) -or -not $pins[$k]) { throw ".github/pins.env is missing a value for $k" }
          }
          $pins.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" } |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "pins: $(($required | ForEach-Object { "$_=$($pins[$_])" }) -join '  ')"

      # Keyed on the exact pins rather than on the workflow file, so the cache is
      # invalidated when -- and only when -- a version changes. No restore-keys: a
      # partial restore would hand the run a different version set than the one asked
      # for, which is the failure this repo cares most about avoiding.
      - name: Cache pinned PowerShell modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/powershell/Modules
          key: psmodules-${{ runner.os }}-pester${{ env.PESTER_VERSION }}-${{ env.PESTER_COMPAT_VERSION }}-pssa${{ env.PSSA_VERSION }}-psc${{ env.PSCOMPLEXITY_VERSION }}

      # Install only what the cache did not restore. Every gate below asserts the exact
      # version it needs, so a partially-populated cache cannot silently change what ran.
      - name: Install pinned modules
        shell: pwsh
        run: |
          $wanted = @(
            @{ Name = 'Pester';           Version = $env:PESTER_VERSION }
            @{ Name = 'Pester';           Version = $env:PESTER_COMPAT_VERSION }
            @{ Name = 'PSScriptAnalyzer'; Version = $env:PSSA_VERSION }
            @{ Name = 'PSComplexity';     Version = $env:PSCOMPLEXITY_VERSION }
          )
          foreach ($m in $wanted) {
            if (Get-Module -ListAvailable -Name $m.Name | Where-Object { $_.Version -eq [version]$m.Version }) {
              Write-Host "cached   $($m.Name) $($m.Version)"
              continue
            }
            Write-Host "install  $($m.Name) $($m.Version)"
            Install-Module $m.Name -RequiredVersion $m.Version -Force -Scope CurrentUser
          }
          # Fail here rather than three steps later with a confusing version error.
          foreach ($m in $wanted) {
            if (-not (Get-Module -ListAvailable -Name $m.Name | Where-Object { $_.Version -eq [version]$m.Version })) {
              throw "$($m.Name) $($m.Version) is not available after install"
            }
          }

      - name: Module manifest is valid + imports
        shell: pwsh
        run: |
          Test-ModuleManifest ./PSMutant.psd1 | Out-Null
          Import-Module ./PSMutant.psd1 -Force
          Get-Command Invoke-PSMutation -ErrorAction Stop | Out-Null

      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: |
          # One committed script, shared with code-scanning.yml. This step used to spell the
          # invocation out and pass -Severity Error, Warning while code scanning passed no
          # filter, so every Information-severity rule was invisible to the gate that FAILS
          # and visible to the gate that BLOCKS -- see #76 and the script's own header.
          $findings = ./tools/Invoke-PSMutantAnalyzer.ps1
          if ($findings) {
            $findings | Format-Table Severity, RuleName, ScriptName, Line, Message -AutoSize
            throw "$($findings.Count) PSScriptAnalyzer finding(s) -- lint gate failed"
          }
          Write-Host 'Lint clean.'

      - name: Unit tests
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          # Classic `Should -Be` is an error here: the suite is fully migrated, and this
          # keeps it that way. It does not reach the fixture files the suite writes out.
          $cfg.Should.DisableV5 = $true
          $r = Invoke-Pester -Configuration $cfg
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) test(s) failed" }

      # Coverage is measured by a committed script, not by a snippet living only here, so
      # that a developer checking by hand runs exactly what the gate runs. The figure used
      # to be folklore; it is now enforced at 100.
      - name: Coverage gate (100%)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION -Force
          ./tools/Measure-PSMutantCoverage.ps1

      # Complexity gate via our sibling module PSComplexity (faithful cognitive metric).
      - name: Complexity gate (PSComplexity)
        shell: pwsh
        run: |
          Import-Module PSComplexity -RequiredVersion $env:PSCOMPLEXITY_VERSION -Force
          if (-not (Test-PSComplexity -Path ./src -Recurse -MaxCyclomatic 15 -MaxCognitive 15)) {
            throw 'Complexity gate failed -- a unit exceeds 15 cyclomatic or cognitive.'
          }

      - name: Mutation test PSMutant against itself (gated)
        shell: pwsh
        run: |
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION -Force
          Import-Module ./PSMutant.psd1 -Force
          $result = Invoke-PSMutation -ConfigFile ./psmutant.self.config.json -SourceRoot . -Quiet
          Write-Host "Self mutation score: $($result.Score)% ($($result.Killed)/$($result.Total))"
          if ($result.ExitCode -ne 0) { throw "Mutation score $($result.Score)% is below the break threshold" }

      # The manifest promises Pester >= 5.0.0, but the suite above runs on exactly one
      # version, so nothing in it can prove that promise. This step loads the OTHER
      # installed version and runs a real mutation whose fixture must leave survivors.
      # Before issue #16 this reported a silent, perfect, entirely fake 100%.
      - name: Pester compatibility guard (runs under the version the suite does not use)
        shell: pwsh
        run: ./tools/Test-PSMutantPesterCompatibility.ps1 -PesterVersion $env:PESTER_COMPAT_VERSION
