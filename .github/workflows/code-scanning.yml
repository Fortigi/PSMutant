# Code scanning for PowerShell. CodeQL does NOT support PowerShell, so we use
# PSScriptAnalyzer (the PowerShell static analyzer), convert its findings to SARIF, and
# upload them to GitHub code scanning — the same "code_scanning" gate IdentityAtlas gets
# from CodeQL, with a tool that actually understands the language.
name: Code scanning

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 02:00 UTC

concurrency:
  group: code-scanning-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (PSScriptAnalyzer)
    runs-on: ubuntu-latest
    # Bounded so a wedged runner fails in minutes rather than holding a REQUIRED check
    # pending for the 6-hour default, which blocks every merge behind it.
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Every pinned version comes from one committed file, so the gates cannot drift apart.
      # Parsed and validated before it is exported: a missing key would otherwise become an
      # empty version string and a silently wrong cache key.
      - name: Load pinned versions
        shell: pwsh
        run: |
          $required = 'PESTER_VERSION', 'PESTER_COMPAT_VERSION', 'PSSA_VERSION',
                      'PSCOMPLEXITY_VERSION', 'CONVERTTOSARIF_VERSION', 'PSSA_PATHS'
          $pins = @{}
          foreach ($line in Get-Content .github/pins.env) {
            $t = $line.Trim()
            if (-not $t -or $t.StartsWith('#')) { continue }
            $k, $v = $t -split '=', 2
            $pins[$k.Trim()] = $v.Trim()
          }
          foreach ($k in $required) {
            if (-not $pins.ContainsKey($k) -or -not $pins[$k]) { throw ".github/pins.env is missing a value for $k" }
          }
          $pins.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" } |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "pins: $(($required | ForEach-Object { "$_=$($pins[$_])" }) -join '  ')"

      - name: Run PSScriptAnalyzer → SARIF
        shell: pwsh
        run: |
          # Install only what the runner image does not already have, exactly as ci.yml does.
          # An unconditional -Force here collides with the PSScriptAnalyzer the image ships:
          # the install warns "currently in use" and carries on, and Invoke-ScriptAnalyzer then
          # dies with a bare "Object reference not set to an instance of an object" that names
          # neither a file nor a rule. That failed this REQUIRED check on a green branch, and
          # a re-run with no code change passed -- so it blocks merges at random.
          $wanted = @(
            @{ Name = 'PSScriptAnalyzer'; Version = $env:PSSA_VERSION }
            @{ Name = 'ConvertToSARIF';   Version = $env:CONVERTTOSARIF_VERSION }
          )
          foreach ($m in $wanted) {
            if (Get-Module -ListAvailable -Name $m.Name | Where-Object { $_.Version -eq [version]$m.Version }) {
              Write-Host "cached   $($m.Name) $($m.Version)"
              continue
            }
            Write-Host "install  $($m.Name) $($m.Version)"
            Install-Module $m.Name -RequiredVersion $m.Version -Force -Scope CurrentUser
          }
          # Fail here, naming the module, rather than inside the analyzer with a null reference.
          foreach ($m in $wanted) {
            if (-not (Get-Module -ListAvailable -Name $m.Name | Where-Object { $_.Version -eq [version]$m.Version })) {
              throw "$($m.Name) $($m.Version) is not available after install"
            }
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSA_VERSION
          Import-Module ConvertToSARIF -RequiredVersion $env:CONVERTTOSARIF_VERSION
          # The same paths and settings the lint gate uses. It used to scan '.', which
          # happened to coincide because PSScriptAnalyzer only reads .ps1/.psm1/.psd1 --
          # a coincidence, not an agreement, and this is a required check.
          $paths = ($env:PSSA_PATHS -split ' ') | Where-Object { $_ }
          $findings = $paths | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          }
          @($findings) | ConvertTo-SARIF -FilePath results.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          sarif_file: results.sarif
          category: psscriptanalyzer
